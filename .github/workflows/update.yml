name: Update lists

on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов
  workflow_dispatch: {}      # кнопка "Run workflow" вручную
  push:
    paths:
      - custom.txt
      - exclude.txt
      - build.py

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build lists
        run: python build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Update lists $(date -u +%F)"
            git push
          fi
